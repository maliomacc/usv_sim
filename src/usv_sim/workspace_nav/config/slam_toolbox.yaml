# =============================================================================
# slam_toolbox.yaml — Minimal slam_toolbox Configuration
# TEKNOFEST USV | workspace_ros/config/
# =============================================================================
# This is the minimal config for slam_toolbox's async_slam_toolbox_node.
# Parameters not listed here use slam_toolbox defaults, which are appropriate
# for a small, bounded maritime environment (~50x50m competition pool).
#
# Key architectural decisions explained below.
# =============================================================================

slam_toolbox:
  ros__parameters:

    # ── Solver ────────────────────────────────────────────────────────────────
    # solver_plugin: g2o is the default and battle-tested for 2D SLAM.
    # ceres_solver is more robust for large maps but not needed here.
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ── Topic & Frames ────────────────────────────────────────────────────────
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    # scan_topic is the input scan. We remap /scan → /scan/filtered in the
    # launch file, so slam_toolbox receives the filtered LaserScan.
    scan_topic: /scan/filtered

    # ── Scan Matching ─────────────────────────────────────────────────────────
    # Use scan matching for loop closure — important in a pool environment
    # where the USV returns to the start area.
    use_scan_matching: true
    use_scan_barycenter: true

    # ── Map Parameters ────────────────────────────────────────────────────────
    # 0.05m (5cm) resolution is standard for USV obstacle avoidance.
    # Nav2 costmap_2d will inflate buoy obstacles from this base resolution.
    resolution: 0.05
    map_update_interval: 5.0       # Seconds between OccupancyGrid publishes

    # ── Maximum likelihood parameters ─────────────────────────────────────────
    max_laser_range: 8.0           # Must match A1M8 xacro <max> value
    minimum_time_interval: 0.5     # Min seconds between accepted scans
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000    # 40MB stack — safe on Orin NX 8GB

    # ── Mode (overridden by launch argument) ──────────────────────────────────
    # "mapping"      → async SLAM, builds new map
    # "localization" → loads existing .posegraph, pure localization
    mode: mapping

    # ── Loop Closure ──────────────────────────────────────────────────────────
    # Enable loop closure for the pool environment where the USV revisits
    # areas (e.g., returning past gate buoys).
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ── Correlation Parameters ────────────────────────────────────────────────
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # ── Loop Closure Parameters ───────────────────────────────────────────────
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ── Distance thresholds for adding new poses ──────────────────────────────
    # USV at low speed — add a node every 0.5m movement or 0.5 rad turn.
    minimum_travel_distance: 0.5
    minimum_travel_heading: 0.5
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
