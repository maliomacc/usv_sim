bt_navigator:
  ros__parameters:
    use_sim_time: true 
    global_frame: map
    robot_base_frame: base_link
    odom_topic: "/odometry/filtered"
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true 

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true 

controller_server:
  ros__parameters:
    use_sim_time: true 
    controller_frequency: 20.0                
    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.05

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 12.0

    general_goal_checker:
      stateful: true 
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 1.0
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.2        
      max_angular_accel: 2.0           
      allow_reversing: false 
     
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: true
      min_lookahead_dist: 1.0
      max_lookahead_dist: 3.0
      cost_scaling_factor: 0.5
      inflation_radius: 1.5

      use_regulated_linear_velocity_scaling: true    
      regulated_linear_scaling_min_speed: 0.1
      regulated_linear_scaling_min_radius: 2.0 
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 4.0  
      cost_scaling_gain: 0.8
      use_approach_vel_scaling: true
      min_approach_linear_velocity: 0.1    
      approach_velocity_scaling_dist: 2.0

      use_rotate_to_heading: false 
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      min_distance_to_obstacle: 0.8
      stateful: true
      
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 20
      height: 15
      resolution: 0.05
      footprint: "[[0.5, 0.3], [0.5, -0.3], [-0.5, -0.3], [-0.5, 0.3]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0
        inflation_radius: 1.5
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        publish_observations: True
        enabled: True
        # ── Sensor Fusion: 2D LiDAR + ZED PointCloud2 ───────────────────────
        observation_sources: scan zed_points
        scan:
          topic: /scan/filtered
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          obstacle_max_range: 10.0
          obstacle_min_range: 0.1
          raytrace_max_range: 10.0
          raytrace_min_range: 0.1
        zed_points:
          # ZED 1.0 derinlik noktası bulutu — yüzey seviyesinin üst/alt engelleri yakalar
          topic: /zed/depth/points
          data_type: "PointCloud2"
          # Yalnızca LiDAR'ın ıskaladığı yükseklik dilimini işle (su yüzeyi üstü engeller)
          max_obstacle_height: 2.5
          min_obstacle_height: 0.1
          clearing: True
          marking: True
          obstacle_max_range: 8.0
          obstacle_min_range: 0.5
          raytrace_max_range: 8.0
          raytrace_min_range: 0.5
      always_send_full_costmap: True
      
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true 
      width: 300
      height: 300
      footprint: "[[0.5, 0.3], [0.5, -0.3], [-0.5, -0.3], [-0.5, 0.3]]"
      resolution: 0.5
      track_unknown_space: True
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /roboboat/sensors/lidar/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 15.0
          raytrace_min_range: 0.1
          obstacle_max_range: 15.0
          obstacle_min_range: 0.1
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0
        inflation_radius: 2.0
      always_send_full_costmap: True
      
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
        
        
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 1.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame: map
    local_frame: odom 
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    
    simulate_ahead_time: 3.0
    max_rotational_vel: 1.0                 
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: true
    

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false  
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 50


velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: "CLOSED_LOOP"

    max_velocity: [2.0, 0.0, 2.0]
    min_velocity: [0.0, 0.0, -2.0]
    max_accel: [2.0, 0.0, 1.0]
    max_decel: [-2.0, 0.0, -2.0]

    odom_topic: "odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.02, 0.0, 0.02]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop"]
    PolygonStop:
      type: "polygon"
      points: "[[0.6, 0.4], [0.6, -0.4], [-0.6, -0.4], [-0.6, 0.4]]"
      action_type: "stop"
      min_points: 4
      visualize: True
      polygon_pub_topic: "polygon_stop"
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/roboboat/sensors/lidar/scan"
      min_height: 0.05
      max_height: 0.5
      enabled: True

docking_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.05
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    # Empty dock plugins - USV doesn't dock
    dock_plugins: []
    dock_database: []