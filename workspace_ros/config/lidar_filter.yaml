lidar_processor:
  ros__parameters:
    # Topic configuration
    input_topic: "/roboboat/lidar/points"
    output_topic: "/roboboat/lidar/filtered"

    # Voxel grid downsampling
    voxel_size: 0.05  # meters (5cm grid)

    # Passthrough filter (Z axis and range)
    min_z: -2.0       # Below water level
    max_z: 5.0        # Above mast height
    min_range: 1.0    # Minimum distance (avoid boat structure + close water)
    max_range: 100.0  # Maximum LiDAR range (VLP-16)

    # Height Above Water (HAW) filtering - Primary water removal
    # Based on PCL Height Above Ground method
    # Şamandıralar su seviyesinden ~0.3m+ yüksekte, dalga yansımaları 0-0.2m arası
    enable_haw_filter: true
    sensor_height: 0.45      # LiDAR height above water level (meters)
    haw_min: 0.25            # Min height above water - agresif filtreleme (>25cm)
    haw_max: 10.0            # Max height above water

    # Water plane removal (RANSAC-based) - Secondary cleanup
    enable_water_removal: true
    water_plane_distance: 0.15       # Distance threshold (meters)
    water_plane_iterations: 50       # RANSAC iterations
    water_plane_angle_threshold: 10.0  # Horizontal plane tolerance (degrees)
    water_z_min: -0.5                # Water detection zone min
    water_z_max: 0.5                 # Water detection zone max

    # Outlier removal (radius-based)
    enable_outlier_removal: true
    radius_search: 0.5               # Search radius (meters)
    min_neighbors: 3                 # Minimum neighborhood points
