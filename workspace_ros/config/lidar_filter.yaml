lidar_processor:
  ros__parameters:
    # Topic configuration
    input_topic: "/roboboat/lidar/points"
    output_topic: "/roboboat/lidar/filtered"

    # Voxel grid downsampling
    voxel_size: 0.02  # meters (2cm grid - maksimum detay)

    # Passthrough filter (Z axis and range)
    # LiDAR z=0.45m'de, su yüzeyi=0, engeller 0.25-0.5m yukarıda
    min_z: -0.25      # Su seviyesinin biraz üstü (LiDAR frame'inde ~0.2m)
    max_z: 3.0        # Yeterli yükseklik
    min_range: 1.0    # Tekne yapısından uzak (1m minimum)
    max_range: 40.0   # LiDAR sensör limiti

    # Water plane removal (RANSAC-based)
    enable_water_removal: false  # Yükseklik filtresi yeterli

    # Radius Outlier removal (temel gürültü temizleme)
    enable_outlier_removal: true
    radius_search: 0.4               # Arama yarıçapı
    min_neighbors: 3                 # Minimum komşu sayısı

    # Statistical Outlier Removal (SOR) - Gelişmiş gürültü temizleme
    # Reference: PCL StatisticalOutlierRemoval, lidar-main package
    enable_sor: true
    sor_k_neighbors: 20              # K en yakın komşu
    sor_std_multiplier: 1.5          # μ + σ×mult üzerindeki noktalar kaldırılır

    # Euclidean Clustering - Nesne segmentasyonu
    # Reference: lidar-main points_cluster
    # DISABLED: Hareket halinde çok fazla nokta filtreleyebilir
    enable_clustering: false
    cluster_tolerance: 0.3           # Kümeleme mesafe eşiği (meters)
    min_cluster_size: 5              # Minimum nokta/küme (gürültüyü eler)
    max_cluster_size: 5000           # Maximum nokta/küme
