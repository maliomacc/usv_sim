# PID Controller Parameters for YILDIZ USV
# Author: YILDIZ USV Team

# Heading PID Controller
# Controls angular velocity based on heading error
heading_pid:
  kp: 1.2                    # Proportional gain
  ki: 0.05                   # Integral gain (eliminates steady-state error)
  kd: 0.3                    # Derivative gain (dampens oscillations)
  integral_max: 1.0          # Anti-windup limit for integral term
  output_min: -1.5           # Min angular velocity (rad/s)
  output_max: 1.5            # Max angular velocity (rad/s)

# Cross-track Error PID Controller
# Corrects lateral deviation from path
cross_track_pid:
  kp: 0.5
  ki: 0.01
  kd: 0.2
  integral_max: 0.5
  output_min: -0.5           # Max heading correction (rad)
  output_max: 0.5

# Velocity PID Controller
# Controls linear velocity
velocity_pid:
  kp: 0.8
  ki: 0.02
  kd: 0.1
  integral_max: 0.5
  output_min: -2.0           # Max deceleration (m/s)
  output_max: 2.0            # Max acceleration (m/s)
  feedforward_gain: 0.5      # Feedforward for steady-state tracking

# Velocity Smoother Parameters
velocity_smoother:
  rate: 50.0                 # Control rate (Hz)
  max_linear_accel: 1.0      # Max forward acceleration (m/s^2)
  max_linear_decel: 2.0      # Max braking deceleration (m/s^2)
  max_angular_accel: 1.5     # Max angular acceleration (rad/s^2)
  max_angular_decel: 2.5     # Max angular deceleration (rad/s^2)

  # Velocity limits
  max_linear_vel: 2.0        # Max forward velocity (m/s)
  min_linear_vel: -0.5       # Max reverse velocity (m/s)
  max_angular_vel: 1.5       # Max turn rate (rad/s)

# Velocity Arbiter Parameters
velocity_arbiter:
  rate: 50.0                 # Arbitration rate (Hz)
  timeout: 0.5               # Source timeout (seconds)

  # Priority levels (lower = higher priority)
  priorities:
    avoid: 1                 # Emergency obstacle avoidance
    nav: 2                   # Waypoint navigation
    task: 3                  # Mission tasks (kamikaze, etc.)
    explore: 4               # Autonomous exploration (lowest priority)

# Pure Pursuit Parameters (for waypoint following)
pure_pursuit:
  lookahead_min: 2.0         # Minimum lookahead distance (m)
  lookahead_max: 8.0         # Maximum lookahead distance (m)
  lookahead_gain: 0.5        # L_d = L_min + gain * velocity
  goal_tolerance: 2.0        # Waypoint reached tolerance (m)
  heading_tolerance: 0.3     # Heading alignment tolerance (rad)

# Obstacle Avoidance Thresholds (reference from obstacle_avoidance.yaml)
avoidance:
  critical_distance: 1.5     # Emergency stop/reverse (m)
  slow_distance: 4.0         # Start slowing down (m)
  avoid_distance: 6.0        # Start gentle avoidance (m)

# Exploration Parameters
exploration:
  cruise_speed: 1.5          # Default exploration speed (m/s)
  wander_interval: 5.0       # Random direction change interval (s)
  wander_magnitude: 0.3      # Random turn magnitude (rad/s)
  prefer_open_space: true    # Bias toward open areas
